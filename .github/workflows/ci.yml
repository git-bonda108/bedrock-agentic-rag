name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, tests, eval gate, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - run: uv pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Unit, integration and infrastructure tests
        run: pytest --cov=agentic_rag --cov-report=term --cov-fail-under=80

      - name: Offline retrieval eval gate
        run: python -m evals.run_evals offline

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Lambda package and synthesize CloudFormation
        run: ./scripts/build_lambda.sh && npx --yes aws-cdk@2 synth --quiet

  container:
    name: build and smoke-test API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t agentic-rag-api .

      - name: Smoke test (no AWS calls; in-memory store, hashing embeddings)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e AWS_DEFAULT_REGION=us-west-2 -e AWS_ACCESS_KEY_ID=x -e AWS_SECRET_ACCESS_KEY=x \
            -e VECTOR_STORE=memory -e EMBEDDINGS_PROVIDER=hashing -e RERANK_ENABLED=false \
            -e DOCUMENTS_BUCKET=smoke -e API_KEY=smoke agentic-rag-api
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/search \
            -H 'content-type: application/json' -d '{"query":"x"}')
          test "$code" = "401"
          docker logs api
