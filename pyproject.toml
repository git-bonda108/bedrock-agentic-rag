[project]
name = "bedrock-agentic-rag"
version = "0.1.0"
description = "Self-correcting agentic RAG on AWS: LangGraph on Amazon Bedrock, S3 Vectors, Lambda ingestion, ECS Fargate API, CDK and eval-gated CI/CD"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Satya Bonda" }]
dependencies = [
    "boto3>=1.43",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-aws>=1.8",
    "langgraph-checkpoint-aws>=1.2.3",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = ["aws-lambda-powertools[tracer]>=3.35"]
mcp = ["mcp>=2.0"]
dev = [
    "aws-lambda-powertools[tracer]>=3.35",
    "mcp>=2.0",
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3,dynamodb]>=5.2",
    "ruff>=0.6",
    "aws-cdk-lib>=2.272",
    "constructs>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"evals/**" = ["S"]
